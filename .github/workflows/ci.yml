name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: pytest -q

      - name: 跑离线 baseline 评测
        run: python -m mdagent.eval.runner --provider offline

      - name: 跑消融实验
        run: python -m mdagent.eval.ablation --provider offline

      - name: 上传评测报告
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: mdagent/eval/reports/
